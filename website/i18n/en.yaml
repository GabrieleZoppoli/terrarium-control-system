# Home ledger — live totals from the Pi's InfluxDB
ledger_kicker:         "Live from the running log"
ledger_per_month:      "per month"
ledger_title:          "Running totals"
ledger_intro:          "Measurements started in @SINCE@. The current marine-fridge cabinet has been running since late 2022, and replaced a chiller-cooled tank that ran from 2016."

ledger_mist_label:     "Mist cycles"
ledger_mist_caption:   "Each cycle fires when cabinet humidity drops below the Colombian-curve target. Since 2026-05-05 the duration depends on the regime: 10 s by day, 20 s at night. RH gain per event is about +2 % overnight (sealed cabinet, compressor running) and +3–4 % by day (fans exchanging air with the drier room). Water volume per cycle is still being calibrated."

ledger_kwh_label:      "Electricity"
ledger_kwh_unit:       "kWh"
ledger_kwh_caption:    "Meross MSS310 on the whole power strip: compressor, 4× ChilLED grow lights, fans, Pi, sensors. Mean ~110 W continuous: 60–90 W overnight, ~220 W midday peak under the raised-cosine LED curve (peak slider 70 at solar noon, in place since 2026-05-04)."

ledger_cost_label:     "Electricity bill"
ledger_cost_caption:   "At Italian residential rates (~€0.30/kWh)."

ledger_co2_label:      "CO₂ fixed by the plants"
ledger_co2_unit:       "kg"
ledger_co2_caption:    "Modelled, not measured: 75 plants × ~0.36 g/day. A small fraction of what the cabinet's electricity emits."

ledger_data_label:     "Sensor readings"
ledger_data_unit:      "million"
ledger_data_caption:   "33 signals, one reading per minute, into InfluxDB."

ledger_fog_label:      "Hours near-saturated"
ledger_fog_caption:    "Cumulative time at ≥ 95 % RH, the threshold above which epiphytic moss takes up water."

