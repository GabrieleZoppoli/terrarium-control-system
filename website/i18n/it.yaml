ledger_title:          "Totali in corso"
ledger_intro:          "Le misurazioni sono iniziate a @SINCE@. Il terrario attuale a compressore marino è in funzione da fine 2022 e ha sostituito una vasca raffreddata a chiller in funzione dal 2016."

ledger_mist_label:     "Cicli di nebbia"
ledger_mist_caption:   "Ogni ciclo parte quando l'umidità del terrario scende sotto il target della curva colombiana. Dal 2026-05-05 la durata dipende dal regime: 10 s di giorno, 20 s di notte. Guadagno di UR per evento circa +2 % di notte (terrario sigillato, compressore in funzione) e +3–4 % di giorno (ventole che scambiano aria con la stanza più secca). Il volume d'acqua per ciclo è ancora da calibrare."

ledger_kwh_label:      "Elettricità"
ledger_kwh_unit:       "kWh"
ledger_kwh_caption:    "Meross MSS310 sull'intera ciabatta: compressore, 4× luci ChilLED, ventole, Pi, sensori. Media ~110 W continui: 60–90 W di notte, picco ~220 W a mezzogiorno con la curva LED a coseno rialzato (picco slider 70 al mezzogiorno solare, attiva dal 2026-05-04)."

ledger_cost_label:     "Bolletta elettrica"
ledger_cost_caption:   "A prezzi italiani residenziali (~€0,30/kWh)."

ledger_co2_label:      "CO₂ fissata dalle piante"
ledger_co2_unit:       "kg"
ledger_co2_caption:    "Stima da modello, non misurata: 75 piante × ~0,36 g/giorno. Una piccola frazione di quanto emette l'elettricità del terrario."

ledger_data_label:     "Letture dei sensori"
ledger_data_unit:      "milioni"
ledger_data_caption:   "33 segnali, una lettura al minuto, dentro InfluxDB."

ledger_fog_label:      "Ore di quasi-saturazione"
