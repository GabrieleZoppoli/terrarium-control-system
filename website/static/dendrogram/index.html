<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Collection — Phylogenetic Dendrogram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #111318 0%, #090a0d 50%, #050607 100%);
    color: #e0e0e0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden; user-select: none;
  }
  #chart { width: 100vw; height: 100vh; cursor: grab; }
  #chart:active { cursor: grabbing; }

  .link {
    fill: none; stroke-opacity: 0.7; stroke-width: 1.4px;
    transition: stroke-opacity 0.3s ease;
  }
  .link.highlighted { stroke-opacity: 0.95; stroke-width: 1.8px; }
  .link.dimmed { stroke-opacity: 0.12; }

  .node { cursor: pointer; transition: opacity 0.3s ease; }
  .node .hit { fill: transparent; pointer-events: all; }
  .node .leaf-ring { fill: none; stroke-opacity: 0.35; stroke-width: 1.4; pointer-events: none; }
  .node .dot { transition: r 0.25s ease; pointer-events: none; }
  .node:hover .dot { filter: drop-shadow(0 0 4px currentColor); }
  .node.collapsed .dot { stroke-width: 2; }
  .node text { pointer-events: none; font-family: 'Inter', system-ui, sans-serif; transition: opacity 0.25s ease; }
  .node .branch-label { font-weight: 400; }
  .node.depth-1 .branch-label { text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
  .node.depth-4 .branch-label { font-weight: 500; font-style: italic; }
  .node .leaf-label { font-family: 'Crimson Pro', Georgia, serif; font-style: italic; }
  .node .leaf-label .ph { fill: #FFD54F; font-style: normal; font-size: 0.75em; }
  .node.collapsed:hover .branch-label { text-decoration: underline; text-underline-offset: 3px; }

  /* Labels that would collide are hidden until hover / focus / search */
  .node.label-culled text { opacity: 0; }
  .node.label-culled:hover text, .node.label-culled.show-label text { opacity: 1; }

  .node.dimmed { opacity: 0.22; }
  .node.dimmed:hover { opacity: 1; }

  /* ── Title ── */
  #title {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 10; pointer-events: none;
  }
  #title h1 {
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 22px; font-weight: 300; letter-spacing: 4px;
    text-transform: uppercase; color: #c8c8c8;
    text-shadow: 0 0 40px rgba(120,120,120,0.15);
  }
  #title .sub {
    font-size: 11px; color: #555; margin-top: 4px; letter-spacing: 1.2px;
    font-weight: 300;
  }

  /* ── Search ── */
  #search-box {
    position: fixed; top: 18px; right: 20px; z-index: 20;
    display: flex; align-items: center; gap: 8px;
  }
  #search {
    background: rgba(20,22,28,0.85); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px; padding: 8px 16px; color: #ddd; font-size: 13px;
    width: 230px; outline: none; backdrop-filter: blur(12px);
    font-family: 'Inter', sans-serif; font-weight: 300;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #search:focus {
    border-color: rgba(142,36,170,0.5);
    box-shadow: 0 0 20px rgba(142,36,170,0.1);
  }
  #search::placeholder { color: #444; }
  #search-count { font-size: 11px; color: #666; font-weight: 300; }

  /* ── Breadcrumb ── */
  #breadcrumb {
    position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 11px; color: #555; display: flex;
    gap: 4px; align-items: center; font-weight: 300;
  }
  #breadcrumb span { cursor: pointer; transition: color 0.2s; }
  #breadcrumb span:hover { color: #eee; }
  #breadcrumb .sep { color: #333; cursor: default; }

  /* ── Info Panel ── */
  #info {
    position: fixed; bottom: 20px; right: 20px; z-index: 20;
    background: rgba(14,16,20,0.92);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 20px 24px; width: 320px;
    display: none; backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #info .close {
    position: absolute; top: 10px; right: 14px; cursor: pointer;
    color: #555; font-size: 18px; transition: color 0.2s;
  }
  #info .close:hover { color: #eee; }
  #info .taxon {
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 18px; font-weight: 400; margin-bottom: 2px;
  }
  #info .rank {
    font-size: 9px; text-transform: uppercase; letter-spacing: 2px;
    color: #666; margin-bottom: 10px; font-weight: 500;
  }
  #info .detail {
    font-size: 12px; color: #888; margin: 4px 0; font-weight: 300;
    line-height: 1.5;
  }
  #info .detail b { color: #aaa; font-weight: 500; }

  /* Photo slideshow in info panel */
  #info-photos {
    margin-top: 12px; display: none;
  }
  #info-photos .slideshow {
    position: relative; width: 100%; overflow: hidden; border-radius: 8px;
    cursor: pointer;
  }
  #info-photos .slideshow img {
    width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px;
    display: block; transition: opacity 0.5s ease;
  }
  #info-photos .slideshow img.slide-hidden { display: none; }
  #info-photos .slideshow:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #info-photos .slide-dots {
    display: flex; justify-content: center; gap: 5px; margin-top: 8px;
  }
  #info-photos .slide-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #444;
    cursor: pointer; transition: background 0.25s;
  }
  #info-photos .slide-dot.active { background: #bbb; }
  #info-photos .photo-hint {
    font-size: 10px; color: #555; margin-top: 6px;
    text-align: center; font-weight: 300;
  }
  .has-photo-indicator {
    font-size: 9px; fill: #FFD54F; pointer-events: none; opacity: 0.7;
  }

  /* Lightbox */
  #lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.92); display: none;
    justify-content: center; align-items: center;
    backdrop-filter: blur(8px);
  }
  #lightbox img {
    max-width: 85vw; max-height: 85vh; border-radius: 8px;
    box-shadow: 0 16px 64px rgba(0,0,0,0.6);
    cursor: default;
  }
  #lightbox .lb-close {
    position: absolute; top: 24px; right: 32px;
    font-size: 28px; color: #888; cursor: pointer;
    transition: color 0.2s; z-index: 102;
  }
  #lightbox .lb-close:hover { color: #fff; }
  #lightbox .lb-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 36px; color: #888; cursor: pointer;
    transition: color 0.2s; z-index: 102; user-select: none;
    padding: 16px;
  }
  #lightbox .lb-arrow:hover { color: #fff; }
  #lightbox .lb-prev { left: 16px; }
  #lightbox .lb-next { right: 16px; }
  #lightbox .lb-counter {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #666; font-weight: 300; letter-spacing: 1px;
  }
  #lightbox .lb-bg {
    position: absolute; inset: 0; cursor: zoom-out;
  }

  #info .children-list {
    margin-top: 10px; max-height: 200px; overflow-y: auto;
  }
  #info .children-list .child {
    font-size: 11px; color: #777; padding: 3px 0; cursor: pointer;
    transition: color 0.2s; font-weight: 300;
  }
  #info .children-list .child:hover { color: #eee; }
  #info .children-list::-webkit-scrollbar { width: 3px; }
  #info .children-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  /* ── Legend ── */
  #legend {
    position: fixed; bottom: 20px; left: 20px; z-index: 20;
    background: rgba(14,16,20,0.92);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 14px 18px;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  #legend-toggle {
    display: block; background: none; border: 0; color: #888; cursor: pointer;
    font: 500 9px 'Inter', sans-serif; letter-spacing: 2px; text-transform: uppercase; padding: 0;
  }
  #legend:not(.open) { padding: 9px 14px; }
  #legend:not(.open) #legend-body { display: none; }
  #legend.open #legend-toggle { margin-bottom: 8px; }
  #legend .section-title {
    font-size: 9px; text-transform: uppercase; letter-spacing: 2px;
    color: #444; margin: 10px 0 5px; font-weight: 500;
  }
  #legend .section-title:first-child { margin-top: 0; }
  .legend-item {
    display: flex; align-items: center; margin: 3px 0; font-size: 11px;
    color: #888; cursor: pointer; transition: color 0.2s; font-weight: 300;
  }
  .legend-item:hover { color: #eee; }
  .legend-item.muted { opacity: 0.15; }
  .legend-swatch {
    width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0;
  }
  .legend-symbol { margin-right: 6px; font-size: 12px; min-width: 16px; text-align: center; }

  /* ── Controls hint ── */
  #controls {
    position: fixed; top: 62px; right: 20px; z-index: 10;
    font-size: 10.5px; color: #5a5d66; text-align: right; line-height: 1.7;
    font-weight: 300; pointer-events: none;
  }
  #controls b { color: #9a9da6; font-weight: 500; }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed; top: 18px; left: 20px; z-index: 20;
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  #toolbar button, .info-btn {
    background: rgba(20,22,28,0.85); color: #bbb;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 18px;
    padding: 7px 13px; font: 400 12px 'Inter', sans-serif; cursor: pointer;
    backdrop-filter: blur(12px); transition: border-color .2s, color .2s;
  }
  #toolbar button:hover:not(:disabled), .info-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  #toolbar button.on { color: #fff; border-color: rgba(171,71,188,0.6); }
  #toolbar button:disabled { opacity: 0.35; cursor: default; }
  .info-btn { margin: 8px 0 2px; }
  #title { left: 20px !important; top: 58px !important; transform: none !important; text-align: left !important; }


  /* ── Subtle vignette overlay ── */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
  }

  /* ── Text outline replaces removed #text-halo filter ── */
  .branch-label, .leaf-label {
    paint-order: stroke;
    stroke: #090a0d;
    stroke-width: 3px;
    stroke-linejoin: round;
    stroke-opacity: 0.92;
  }
/* Hover photo preview */
#hover-preview {
  position: fixed;
  display: none;
  pointer-events: none;
  z-index: 40;
  background: rgba(15, 16, 20, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  padding: 8px 8px 10px;
  max-width: 276px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#hover-preview.visible { display: block; }
#hover-preview .hover-preview-caption {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #c8c8c8;
  margin-bottom: 6px;
  padding: 0 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#hover-preview .hover-preview-caption.leaf {
  font-style: italic;
  text-transform: none;
  letter-spacing: normal;
  font-size: 11px;
  color: #ddd;
}
#hover-preview .hover-preview-grid {
  display: grid;
  grid-auto-rows: 80px;
  gap: 4px;
}
#hover-preview .hover-preview-grid img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 3px;
  background: #111;
  display: block;
}

  #info { max-height: calc(100vh - 140px); overflow-y: auto; z-index: 25; }
  #info .children-list .child .n { color: #555; font-size: 11px; }
  #info .children-list .child .ph { color: #FFD54F; }

  @media (max-width: 720px) {
    #search-box { top: 12px; right: 12px; left: 12px; }
    #search { width: 100%; flex: 1; font-size: 16px; }
    #toolbar { top: 58px; left: 12px; }
    #title, #controls { display: none; }
    #breadcrumb { top: 100px; left: 12px; transform: none; flex-wrap: wrap; max-width: calc(100vw - 24px); }
    #info { left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 52vh; padding: 16px 18px; }
    #legend { bottom: 12px; left: 12px; }
  }
</style>
</head>
<body>

<div id="vignette"></div>

<div id="title">
  <div class="sub">403 accessions · 91 genera · 25 families</div>
</div>

<div id="breadcrumb"></div>


<div id="search-box">
  <input id="search" type="text" placeholder="Search plants..." autocomplete="off" />
  <span id="search-count"></span>
</div>

<div id="controls">
  <b>click a genus</b> to open its species &middot; click again to fold<br>
  scroll or pinch to zoom &middot; drag to pan &middot; Esc to reset
</div>

<div id="toolbar">
  <button id="btn-all" type="button">All species</button>
  <button id="btn-fold" type="button" disabled>Fold all</button>
  <button id="btn-fit" type="button">Recentre</button>
</div>

<div id="chart"></div>

<div id="info">
  <div class="close" onclick="closeInfo()">&times;</div>
  <div class="rank" id="info-rank"></div>
  <div class="taxon" id="info-taxon"></div>
  <div id="info-details"></div>
  <div id="info-photos">
    <div class="slideshow" id="slideshow"></div>
    <div class="slide-dots" id="slide-dots"></div>
    <div class="photo-hint">Click photo to enlarge</div>
  </div>
  <div id="info-actions"></div>
  <div class="children-list" id="info-children"></div>
</div>

<div id="hover-preview" aria-hidden="true">
  <div class="hover-preview-caption"></div>
  <div class="hover-preview-grid"></div>
</div>

<div id="lightbox">
  <div class="lb-bg" onclick="closeLightbox()"></div>
  <div class="lb-close" onclick="closeLightbox()">&times;</div>
  <div class="lb-arrow lb-prev" onclick="lbNav(-1, event)">&#x2039;</div>
  <img id="lightbox-img" src="" alt="" />
  <div class="lb-arrow lb-next" onclick="lbNav(1, event)">&#x203A;</div>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<div id="legend">
  <button id="legend-toggle" type="button">Legend</button>
  <div id="legend-body">
  <div class="section-title">Evolutionary Groups</div>
  <div id="legend-items"></div>
  <div class="section-title" style="margin-top:14px">Status</div>
  <div style="display:flex;flex-direction:column;gap:3px">
    <div style="font-size:11px;color:#888;display:flex;align-items:center;font-weight:300"><span class="legend-symbol" style="color:#4CAF50">&#x25CF;</span> Alive</div>
    <div style="font-size:11px;color:#888;display:flex;align-items:center;font-weight:300"><span class="legend-symbol" style="color:#C62828">&#x271D;</span> Dead</div>
    <div style="font-size:11px;color:#888;display:flex;align-items:center;font-weight:300"><span class="legend-symbol" style="color:#7E57C2">&#x1F381;</span> Gave away</div>
    <div style="font-size:11px;color:#888;display:flex;align-items:center;font-weight:300"><span class="legend-symbol" style="color:#FFD54F">&#x25C6;</span> Has photo</div>
    <div style="font-size:11px;color:#888;display:flex;align-items:center;font-weight:300"><span class="legend-symbol" style="color:#aaa">&#x25CF;</span> Filled dot = genus, click to open</div>
  </div>
  </div>
</div>

    })

  nodes.transition(t)
    .attr("transform", d => `rotate(${d.x - 90}) translate(${d.y},0)`)
    .style("opacity", 1);

  root.each(d => { d.x0 = d.x; d.y0 = d.y; });
  reapplyHighlight();
  updateToolbar();
}

// ── Camera ──
function extentRadius() { return tipR + (root.leaves().some(isSpecies) ? SPECIES_GAP + 190 : 130); }
function overviewTransform() {
  const R = extentRadius();
  const k = Math.min(width, height) / (2 * R + 24);
  // On narrow screens keep labels legible: fill the width and let the user pan vertically
  return d3.zoomIdentity.scale(Math.max(k, width < 720 ? 0.6 : 0.15));
}
function flyTo(transform) {
  svg.transition().duration(750).ease(d3.easeCubicInOut).call(zoomBehavior.transform, transform);
}
// Centre the camera on a node's outer subtree, at a readable scale.
function flyToNode(d) { flyToNodes([d]); }
function flyToNodes(list) {
  const d = list[0];
  const pts = list.flatMap(d => d.children ? d.leaves() : [d]).map(n => polar(n.x, n.y + (isSpecies(n) ? 150 : 90)));
  list.forEach(d => pts.push(polar(d.x, d.y)));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const cx = (d3.min(xs) + d3.max(xs)) / 2, cy = (d3.min(ys) + d3.max(ys)) / 2;
  const span = Math.max(d3.max(xs) - d3.min(xs), d3.max(ys) - d3.min(ys), 260);
  const k = Math.min(Math.max(Math.min(width, height) / (span + 140), Math.max(overviewTransform().k, 0.8)), 1.35);
  // Keep the subject clear of the info panel: it sits on the right on desktop, at the bottom on phones
  const shiftX = width > 720 ? -170 : 0, shiftY = width > 720 ? 0 : -height * 0.22;
  flyTo(d3.zoomIdentity.translate(-cx * k + shiftX, -cy * k + shiftY).scale(k));
}

// ── Expand / collapse ──
function toggleGenus(d, force) {
  const open = force !== undefined ? force : !expanded.has(d.uid);
  if (open) expanded.add(d.uid); else expanded.delete(d.uid);
  if (showAll && !open) { showAll = false; genera.forEach(gn => expanded.add(gn.uid)); expanded.delete(d.uid); }
  update(d);
}
function expandPathTo(leaf) {
  const gn = leaf.parent;
  if (gn && isGenus(gn)) expanded.add(gn.uid);
}
function setShowAll(v) {
  showAll = v;
  if (!v) expanded.clear();
  update(root);
  flyTo(overviewTransform());
}

// ── Hover photo preview ──
const HOVER_DELAY_MS = 200;
const HOVER_MAX_PHOTOS = 6;
const hoverPreviewEl = document.getElementById('hover-preview');
const hoverPreviewCaptionEl = hoverPreviewEl.querySelector('.hover-preview-caption');
const hoverPreviewGridEl = hoverPreviewEl.querySelector('.hover-preview-grid');
let hoverPreviewTimer = null;
let hoverPreviewVisible = false;
const canHover = window.matchMedia('(hover: hover)').matches;

function schedulePreview(event, d) {
  clearTimeout(hoverPreviewTimer);
  if (!canHover || focusedNode || d.depth < 2) return;
  const x = event.clientX, y = event.clientY;
  hoverPreviewTimer = setTimeout(() => renderHoverPreview(d, x, y), HOVER_DELAY_MS);
}
function pickPreviewTier(n) {
  if (n >= 6) return { cols: 3, max: 6 };
  if (n >= 4) return { cols: 2, max: 4 };
  if (n >= 2) return { cols: 2, max: 2 };
  return { cols: 1, max: 1 };
}
function renderHoverPreview(d, x, y) {
  const raw = collectPreviewPhotos(d, HOVER_MAX_PHOTOS);
  if (raw.length === 0) { hideHoverPreview(); return; }
  const { cols, max } = pickPreviewTier(raw.length);
  hoverPreviewCaptionEl.textContent = isSpecies(d) ? `${d.parent.data.name} ${d.data.name}` : d.data.name;
  hoverPreviewCaptionEl.classList.toggle('leaf', isSpecies(d));
  hoverPreviewGridEl.style.gridTemplateColumns = `repeat(${cols}, 80px)`;
  hoverPreviewGridEl.innerHTML = raw.slice(0, max)
    .map(p => `<img src="${esc(p)}" alt="" onerror="this.style.visibility='hidden'" />`).join('');
  hoverPreviewEl.classList.add('visible');
  hoverPreviewVisible = true;
  positionHoverPreview(x, y);
}
function positionHoverPreview(x, y) {
  const rect = hoverPreviewEl.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight, off = 16;
  let left = x + off, top = y + off;
  if (left + rect.width > vw - 8) left = x - off - rect.width;
  if (top + rect.height > vh - 8) top = y - off - rect.height;
  hoverPreviewEl.style.left = `${Math.max(8, left)}px`;
  hoverPreviewEl.style.top = `${Math.max(8, top)}px`;
}
function clearHoverPreview() { clearTimeout(hoverPreviewTimer); hideHoverPreview(); }
function hideHoverPreview() {
  hoverPreviewEl.classList.remove('visible');
  hoverPreviewVisible = false;
  hoverPreviewGridEl.innerHTML = '';
}

// ── Highlighting ──
function highlight(related, labelled) {
  nodes.classed("dimmed", n => !related.has(n)).classed("show-label", n => labelled.has(n));
  links.classed("dimmed", l => !(related.has(l.source) && related.has(l.target)))
       .classed("highlighted", l => related.has(l.source) && related.has(l.target));
}
function relatedSet(d) { return new Set([...getAncestors(d), ...getDescendants(d)]); }
function onNodeHover(d) {
  if (focusedNode || searchTerm) return;
  const rel = relatedSet(d);
  highlight(rel, new Set([d]));
}
function clearHighlight() {
  if (focusedNode || searchTerm) return;
  nodes.classed("dimmed", false).classed("show-label", false);
  links.classed("dimmed", false).classed("highlighted", false);
}
let searchMatches = [];
function reapplyHighlight() {
  if (searchTerm) {
    const rel = new Set(); searchMatches.forEach(m => getAncestors(m).forEach(a => rel.add(a)));
    highlight(rel, new Set(searchMatches));
  } else if (focusedNode) {
    highlight(relatedSet(focusedNode), new Set([focusedNode]));
  } else {
    clearHighlight();
  }
}

// ── Click ──
function onNodeClick(d) {
  clearHoverPreview();
  if (d.depth === 0) { resetFocus(); return; }
  if (isGenus(d)) {
    // First click on a collapsed genus opens it; clicking the focused, open genus folds it.
    const wasOpen = !!d.children;
    if (!wasOpen) toggleGenus(d, true);
    else if (focusedNode === d) { toggleGenus(d, false); focusedNode = d; showInfo(d); updateBreadcrumb(d); reapplyHighlight(); return; }
  }
  focusedNode = d;
  reapplyHighlight();
  showInfo(d);
  updateBreadcrumb(d);
  if (isGenus(d) || isSpecies(d)) setTimeout(() => flyToNode(isSpecies(d) ? d.parent : d), isGenus(d) ? DUR * 0.6 : 0);
  else flyToNode(d);
}

function resetFocus() {
  clearHoverPreview();
  focusedNode = null;
  reapplyHighlight();
  flyTo(overviewTransform());
  closeInfo();
  d3.select("#breadcrumb").html('');
}

// ── Info panel ──
function showInfo(d) {
  document.getElementById('info-rank').textContent = rankName(d.depth);
  const taxon = document.getElementById('info-taxon');
  const photoSection = document.getElementById('info-photos');
  const childrenEl = document.getElementById('info-children');
  const actionsEl = document.getElementById('info-actions');
  actionsEl.innerHTML = '';

  if (isSpecies(d)) {
    const genus = d.parent ? d.parent.data.name : '';
    const st = d.data.status;
    taxon.innerHTML = `<i>${esc(genus)} ${esc(d.data.name)}</i>${statusIcon(st)}`;
    let details = '';
    if (d.data.vendor) details += `<div class="detail"><b>Source:</b> ${esc(d.data.vendor)}</div>`;
    details += `<div class="detail"><b>Status:</b> ${st==='dead' ? 'Deceased '+CROSS : st==='gave' ? 'Gave away '+GIFT : 'Alive'}</div>`;
    document.getElementById('info-details').innerHTML = details;
    childrenEl.innerHTML = '';
    if (hasPhotos(d)) { startSlideshow(d.data.photos, `${genus} ${d.data.name}`); photoSection.style.display = 'block'; }
    else { stopSlideshow(); photoSection.style.display = 'none'; }
  } else {
    taxon.textContent = d.data.name;
    const sp = speciesOf(d);
    const c = st => sp.filter(n => n.data.status === st).length;
    const photoCount = sp.filter(hasPhotos).length;
    let html = `<div class="detail"><b>Total accessions:</b> ${sp.length}</div>`;
    html += `<div class="detail" style="color:#66BB6A"><b>Alive:</b> ${c('alive')}</div>`;
    if (c('dead')) html += `<div class="detail" style="color:#ef9a9a"><b>Dead:</b> ${c('dead')}</div>`;
    if (c('gave')) html += `<div class="detail" style="color:#b39ddb"><b>Gave away:</b> ${c('gave')}</div>`;
    if (photoCount) html += `<div class="detail" style="color:#FFD54F"><b>With photos:</b> ${photoCount}</div>`;
    document.getElementById('info-details').innerHTML = html;
    stopSlideshow();
    photoSection.style.display = 'none';

    if (isGenus(d)) {
      const btn = document.createElement('button');
      btn.className = 'info-btn';
      btn.textContent = d.children ? 'Fold species' : 'Show species';
      btn.onclick = () => { toggleGenus(d); showInfo(d); if (d.children) flyToNode(d); };
      actionsEl.appendChild(btn);
    }

    const kids = d.allChildren;
    childrenEl.innerHTML = kids.map((k, i) => {
      if (isSpecies(k)) {
        return `<div class="child" data-i="${i}"><i>${esc(k.data.name)}</i>${statusIcon(k.data.status)}${hasPhotos(k) ? ' <span class="ph">'+DIAMOND+'</span>' : ''}</div>`;
      }
      const ph = speciesOf(k).some(hasPhotos) ? ' <span class="ph">'+DIAMOND+'</span>' : '';
      return `<div class="child" data-i="${i}">${esc(k.data.name)} <span class="n">${leafCount(k)}</span>${ph}</div>`;
    }).join('');
    childrenEl.querySelectorAll('.child').forEach(el => {
      el.addEventListener('click', () => {
        const target = kids[+el.dataset.i];
        if (isSpecies(target)) expandPathTo(target);
        if (isSpecies(target) && !target.parent.children) update(target.parent);
        onNodeClick(target);
      });
    });
  }
  taxon.style.color = getColor(d);
  document.getElementById('info').style.display = 'block';
}
function closeInfo() {
  document.getElementById('info').style.display = 'none';
  document.getElementById('info-photos').style.display = 'none';
  stopSlideshow();
}

// ── Slideshow ──
let slidePhotos = [], slideIndex = 0, slideTimer = null;
function startSlideshow(photos, alt) {
  stopSlideshow();
  slidePhotos = photos; slideIndex = 0;
  const container = document.getElementById('slideshow');
  const dots = document.getElementById('slide-dots');
  container.innerHTML = photos.map((p, i) =>
    `<img src="${esc(p)}" alt="${esc(alt)}" class="${i > 0 ? 'slide-hidden' : ''}" onerror="this.style.display='none'" />`).join('');
  container.onclick = () => openLightbox(slideIndex);
  dots.innerHTML = photos.length > 1 ? photos.map((_, i) =>
    `<div class="slide-dot${i === 0 ? ' active' : ''}" onclick="event.stopPropagation();goToSlide(${i})"></div>`).join('') : '';
  if (photos.length > 1) slideTimer = setInterval(() => goToSlide((slideIndex + 1) % slidePhotos.length), 5000);
}
function goToSlide(i) {
  slideIndex = i;
  document.querySelectorAll('#slideshow img').forEach((img, j) => img.classList.toggle('slide-hidden', j !== i));
  document.querySelectorAll('.slide-dot').forEach((d, j) => d.classList.toggle('active', j === i));
  if (slideTimer) { clearInterval(slideTimer); slideTimer = setInterval(() => goToSlide((slideIndex + 1) % slidePhotos.length), 5000); }
}
function stopSlideshow() {
  if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
  slidePhotos = []; slideIndex = 0;
}

// ── Lightbox ──
let lbPhotos = [], lbIndex = 0;
function openLightbox(idx) {
  lbPhotos = slidePhotos;
  lbIndex = typeof idx === 'number' ? idx : 0;
  showLbPhoto();
  document.getElementById('lightbox').style.display = 'flex';
}
function showLbPhoto() {
  document.getElementById('lightbox-img').src = lbPhotos[lbIndex];
  document.getElementById('lb-counter').textContent = lbPhotos.length > 1 ? `${lbIndex + 1} / ${lbPhotos.length}` : '';
  document.querySelector('.lb-prev').style.display = lbPhotos.length > 1 ? '' : 'none';
  document.querySelector('.lb-next').style.display = lbPhotos.length > 1 ? '' : 'none';
}
function lbNav(dir, e) {
  if (e) e.stopPropagation();
  lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
  showLbPhoto();
}
function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

// ── Breadcrumb ──
function updateBreadcrumb(d) {
  const path = getAncestors(d).reverse();
  const bc = d3.select("#breadcrumb"); bc.html('');
  path.forEach((node, i) => {
    if (i > 0) bc.append("span").attr("class", "sep").text(" › ");
    bc.append("span")
      .text(node.depth === 0 ? "All" : node.data.name)
      .style("color", i === path.length - 1 ? getColor(node) : null)
      .on("click", () => node.depth === 0 ? resetFocus() : onNodeClick(node));
  });
}

// ── Search ──
const searchInput = document.getElementById('search');
const searchCount = document.getElementById('search-count');
let searchTimer = null;
let searchOpened = new Set();   // genera opened by the search, folded again when it is cleared
searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 180); });
function runSearch() {
  searchTerm = searchInput.value.trim().toLowerCase();
  searchOpened.forEach(u => expanded.delete(u));
  searchOpened = new Set();
  if (!searchTerm) {
    searchMatches = [];
    searchCount.textContent = '';
    update(root);
    return;
  }
  const sp = ALL_NODES.filter(isSpecies);
  searchMatches = sp.filter(d => {
    const full = `${d.parent.data.name} ${d.data.name}`.toLowerCase();
    return full.includes(searchTerm) || (d.data.vendor || '').toLowerCase().includes(searchTerm);
  });
  // Also match higher ranks by name (e.g. "Droseraceae", "Orchid")
  const ranks = ALL_NODES.filter(d => d.depth >= 1 && !isSpecies(d) && d.data.name.toLowerCase().includes(searchTerm));
  searchCount.textContent = searchMatches.length ? `${searchMatches.length} found` : (ranks.length ? '' : 'none found');
  if (searchMatches.length && searchMatches.length <= 60) {
    searchMatches.forEach(m => { const gu = m.parent.uid; if (!expanded.has(gu)) { expanded.add(gu); searchOpened.add(gu); } });
  }
  update(root);
  if (searchMatches.length === 1) {
    focusedNode = searchMatches[0];
    showInfo(focusedNode); updateBreadcrumb(focusedNode);
    setTimeout(() => flyToNode(focusedNode.parent), DUR * 0.6);
  } else if (searchMatches.length > 1 && searchMatches.length <= 60) {
    const gs = [...new Set(searchMatches.map(m => m.parent))];
    setTimeout(() => flyToNodes(gs), DUR * 0.6);
  } else if (!searchMatches.length && ranks.length) {
    searchTerm = '';
    onNodeClick(ranks[0]);
  }
}

document.addEventListener('keydown', e => {
  const lbOpen = document.getElementById('lightbox').style.display === 'flex';
  if (e.key === 'Escape') {
    if (lbOpen) { closeLightbox(); return; }
    if (searchInput.value) { searchInput.value = ''; runSearch(); }
    resetFocus();
  }
  if (lbOpen) {
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
  }
});
svg.on("click", () => { if (focusedNode) resetFocus(); });

// ── Toolbar ──
const btnAll = document.getElementById('btn-all');
const btnFold = document.getElementById('btn-fold');
const btnFit = document.getElementById('btn-fit');
btnAll.onclick = () => setShowAll(!showAll);
btnFold.onclick = () => { showAll = false; expanded.clear(); searchOpened.clear(); update(root); resetFocus(); };
btnFit.onclick = () => flyTo(overviewTransform());
function updateToolbar() {
  btnAll.textContent = showAll ? 'Genera only' : 'All species';
  btnAll.classList.toggle('on', showAll);
  btnFold.disabled = !showAll && expanded.size === 0;
}

// ── Legend ──
const cladeCounts = {};
ALL_NODES.filter(isSpecies).forEach(d => { const c = getClade(d); cladeCounts[c] = (cladeCounts[c] || 0) + 1; });
const cladeOrder = ["Algae","Bryophytes","Ferns","Gymnosperms","Basal Angiosperms","Monocots","Eudicots"];
const legendItems = d3.select("#legend-items");
cladeOrder.forEach(clade => {
  const count = cladeCounts[clade];
  if (!count) return;
  const item = legendItems.append("div").attr("class", "legend-item")
    .on("click", () => { const n = root.children.find(c => c.data.name === clade); if (n) onNodeClick(n); });
  item.append("div").attr("class", "legend-swatch").style("background", cladeColors[clade] || '#555');
  item.append("span").text(`${clade} (${count})`);
});
const legendEl = document.getElementById('legend');
document.getElementById('legend-toggle').onclick = () => legendEl.classList.toggle('open');
if (window.innerWidth >= 1200 && window.innerHeight >= 760) legendEl.classList.add('open');

// ── Subtitle counts, computed from the data so they never go stale ──
(function () {
  const sp = ALL_NODES.filter(isSpecies).length, gn = genera.length, fam = ALL_NODES.filter(d => d.depth === 3).length;
  const el = document.querySelector('#title .sub');
  if (el) el.textContent = `${sp} accessions \u00b7 ${gn} genera \u00b7 ${fam} families`;
})();

// ── Boot ──
update(root, { instant: true });
svg.call(zoomBehavior.transform, overviewTransform());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => update(root, { instant: true }));
window.addEventListener('resize', () => {
  width = window.innerWidth; height = window.innerHeight;
  svg.attr("width", width).attr("height", height);
  if (!focusedNode) svg.call(zoomBehavior.transform, overviewTransform());
});
</script>
</body>
