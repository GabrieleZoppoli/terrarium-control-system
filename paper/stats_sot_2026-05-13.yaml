# Single source of truth — IV/2SLS + heat-balance statistics
# Generated 2026-05-13 from analysis/02_iv_causal_model.py + memory/wetbulb-analysis.md
# All four manuscripts that report these numbers must cite from this block.

iv_2sls:
  outcome: local_humidity (%)
  endogenous: fan_pwm (outlet+impeller, PWM 0–255)
  instrument: night_B (A/B treatment indicator; 0 = Night A fans-off, 1 = Night B fans-80-PWM)
  experiment_window: "2025-12-15 to 2026-02-18 (~9 weeks; retired 2026-02-18 after the coefficient was characterised)"
  covariates: [const, temp_room, humi_room, freezer, hour_sin, hour_cos]
  covariance: "robust (heteroskedastic, HC3 in stage 1)"
  software: linearmodels.iv.IV2SLS (Python)
  n: 1353
  r_squared: 0.0962
  adjusted_r_squared: 0.0922
  model_f: 823.94
  model_f_pvalue: 0.0000
  first_stage:
    r_squared: 0.152
    instrument_coefficient: -8.2235   # night_B coefficient in stage-1 OLS
    instrument_se: 1.735
    instrument_p_value: 0.000
    instrument_F: 22.5                # >10 = strong (Stock-Yogo)
  second_stage:
    fan_pwm_coefficient: -0.0340      # per +1 PWM unit
    fan_pwm_se: 0.0171
    fan_pwm_t: -1.9877
    fan_pwm_p: 0.0468
    fan_pwm_ci95: [-0.0675, -0.0005]
    interpretation_per_10_pwm: -0.34  # % humidity per +10 PWM (causal)
  reduced_form:
    night_B_coefficient: +0.280
    night_B_ci95: [+0.055, +0.504]
    night_B_pvalue: 0.0145
    interpretation: "ITT effect of Night B treatment (80 PWM vs 0 PWM): +0.28 % humidity"
  wald_estimator:
    formula: "(reduced form) / (first stage) = 0.2796 / -8.2235 = -0.0340 per PWM"
    matches_iv: true
  ols_comparison:
    biased_coefficient_per_10_pwm: +0.150
    interpretation: "OLS attributes humidity-fan correlation backwards because PID drives fans in response to humidity; biased positive."
  paper_wording_replacement: |
    Replaces the Pass-A line ("each +10 PWM of fan speed causes a -0.37% reduction
    in humidity (p < 0.05)"). The corrected value is **-0.34% per +10 PWM (95% CI:
    [-0.68%, -0.005%], p = 0.047, n = 1353 nighttime 5-min observations; first-stage
    F = 22.5; OLS comparison +0.15% per +10 PWM confirms reverse-causal bias of the
    naive regression).** The experiment ran December 2025 to February 2026 and was
    retired once the coefficient was characterised; raw data + script remain in
    `analysis/02_iv_causal_model.py`.

heat_balance:
  status: "RE-RUN 2026-05-12 — see `paper/heat_balance_run_2026-05-12.yaml` for the full structured output and `analysis/heat_balance_rerun.py` for the script. Original (-2.03, +0.37, +0.58) coefficients from a 27-day window are SUPERSEDED. The published HWX §7.4 table must be replaced with the values below."
  rerun_2026_05_12_headline:
    window: "2026-02-08 → 2026-05-12 (~94 d at 5-min cadence)"
    n_5min_rows: 17773
    covariance: "HC3 robust"
    r_squared: 0.163
    f_statistic: 896.9
    coefficients:
      fans_on:     {coef: +0.266, se: 0.070, ci95: [+0.129, +0.403], p: 0.0001}
      freezer_on:  {coef: -1.008, se: 0.021, ci95: [-1.049, -0.966], p: 0.0000}
      t_diff_room: {coef: +0.166, se: 0.011, ci95: [+0.144, +0.188], p: 0.0000}
      light_on:    {coef: -0.344, se: 0.050, ci95: [-0.442, -0.246], p: 0.0000}
    multicollinearity_note: |
      Model 1's `fans_on × freezer_on` interaction term is degenerate with
      `freezer_on` because fans are scheduled ON whenever freezer activates
      (smallest eigenvalue 1.44e-27, design matrix near-singular). The
      reported coefficients above are from re-running Model 1 without
      the redundant interaction.
  rerun_model_2_continuous_pwm:
    description: |
      Using continuous fan_pwm (0-255) instead of binary fans_on:
      fan_pwm coefficient = +0.0002 °C/hr per PWM unit, p = 0.334, 95% CI
      includes zero. The fan effect collapses to undetectable once it is
      modelled at full resolution — the apparent +0.27 °C/hr in Model 1 is
      largely the schedule signature (fans are on during the day when other
      heat sources are also active), not a fan-specific effect.
  pass_c_implications: |
    HWX §7.4 currently reports (-2.03, +0.37, +0.58). Pass C must replace
    with the rerun values:
      • Freezer: -1.01 °C/hr (95% CI: -1.05 to -0.97; n=17773)
      • Fans (binary): +0.27 °C/hr (95% CI: +0.13 to +0.40)
      • Fans (continuous PWM): effectively zero (+0.0002/PWM, p=0.33)
      • Passive: +0.17 °C/hr per °C gradient
    The honest interpretation is that fan effect on cabinet temperature is
    very small and largely indistinguishable from schedule confounds; the
    cooling work is being done by the freezer (-1.01 °C/hr) and the only
    statistically robust counter is the passive room→cabinet conduction
    (+0.17 °C/hr per K). This SUPPORTS the wet-bulb framing — fans aren't a
    sensible-heat term, they're modulating evaporative dynamics. CPN §5.3
    needs to drop the +0.37 figure entirely; the per-PWM coefficient is not
    statistically significant.
  scope_decision_2026_05_12: |
    The +0.37 °C/hr fan coefficient is the GLOBAL heat-balance coefficient
    (covers fan operation across the entire dataset, regardless of wet-bulb
    regime). It is NOT a below-WBT-only quantity. Mac-Claude's HANDOFF read
    was correct.
    Pass-C consequence: CPN §5.3 (L248) must be reworded — it currently
    reads as if +0.37 is the below-WBT regime coefficient. Replace with the
    HardwareX §7.4 framing: a single global sensible-heat fan coefficient
    that combines with a wet-bulb interaction term (linear fade) rather
    than a regime-specific value.
  numbers_quoted_in_paper:
    freezer_effect: -2.03  # °C/hr when compressor active
    fan_effect: +0.37      # °C/hr from outlet+impeller fans
    passive_exchange: +0.58 # °C/hr room→terrarium passive
  missing_for_publication: [N_hours, R_squared, per_coefficient_SE_CI, model_formula, multicollinearity_diagnostic, residual_plots]
  recommended_paper_action: |
    Either (a) re-run the regression from scratch on the current InfluxDB data
    (preferred; would also bring N up from the original ~28-day window to the full
    Meross-instrumented 80.3-day window), or (b) demote the table in HWX §7.4 from
    "preliminary" to "indicative" and re-do the analysis in a follow-on publication.
    Recommend (a); estimated effort ~4 h to write a clean heat-balance regression.
    Until then, all four drafts cite the coefficients with a footnote: "preliminary
    estimates from a single 27-day window; full reanalysis pending."

cooling_test_equilibrium:
  status: "Pass-A claimed 'equilibrium' but tests ran 9.5–9.9 h, not the 24+ h that would justify the term."
  measured: "13.6 °C cabinet at 21.6 °C room (Δ = 8.1 K); deepest 12.3 °C"
  recommended_wording: "Replace 'equilibrium' with 'near-equilibrium (cabinet within 0.5 °C of steady state at test end)' in all four drafts, until a 24-h test is run. A 24-h test is not blocking submission but would convert the language to fully rigorous."

